<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型性能分析 - XSS检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .metrics-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
        }
        .metric-label {
            text-align: center;
            color: #666;
        }
        .model-color-xgboost { color: #667eea; }
        .model-color-bilstm { color: #764ba2; }
        .model-color-transformer { color: #f093fb; }
        .model-color-ensemble { color: #ff6b6b; }
        .back-link {
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-link:hover {
            color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>

        <div class="card mt-3">
            <div class="card-header">
                <h3><i class="fas fa-chart-bar"></i> 模型性能对比分析</h3>
                <p class="mb-0">展示各检测模型的性能指标对比</p>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    <!-- 模型性能指标卡片 -->
                    <div class="col-md-3">
                        <div class="metrics-card">
                            <h5 class="text-center mb-4 model-color-xgboost"><i class="fas fa-tree"></i> XGBoost</h5>
                            <div id="xgboost-metrics"></div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metrics-card">
                            <h5 class="text-center mb-4 model-color-bilstm"><i class="fas fa-brain"></i> BiLSTM</h5>
                            <div id="bilstm-metrics"></div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metrics-card">
                            <h5 class="text-center mb-4 model-color-transformer"><i class="fas fa-project-diagram"></i> Transformer</h5>
                            <div id="transformer-metrics"></div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="metrics-card">
                            <h5 class="text-center mb-4 model-color-ensemble"><i class="fas fa-layer-group"></i> Ensemble</h5>
                            <div id="ensemble-metrics"></div>
                        </div>
                    </div>
                </div>

                <!-- 指标对比柱状图 -->
                <div class="row mt-4">
                    <div class="col-md-12">
                        <div class="metrics-card">
                            <h5>性能指标对比</h5>
                            <div style="position: relative; height: 300px;">
                                <canvas id="metricsChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ROC曲线 -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="metrics-card">
                            <h5>ROC曲线</h5>
                            <div style="position: relative; height: 300px;">
                                <canvas id="rocChart"></canvas>
                            </div>
                            <small class="text-muted">* 基于训练数据生成的ROC曲线</small>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="metrics-card">
                            <h5>混淆矩阵（示例）</h5>
                            <div style="position: relative; height: 300px;">
                                <canvas id="confusionChart"></canvas>
                            </div>
                            <small class="text-muted">* 集成模型的混淆矩阵可视化</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let metricsChart = null;
        let rocChart = null;
        let confusionChart = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadModelMetrics();
        });

        function loadModelMetrics() {
            fetch('/api/model-metrics')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayMetricsCards(data.data);
                        displayMetricsChart(data.data);
                        displayRocChart(data.data);
                        displayConfusionChart();
                    }
                })
                .catch(error => {
                    console.error('Error loading model metrics:', error);
                });
        }

        function displayMetricsCards(models) {
            models.forEach(model => {
                const containerId = `${model.model_name.toLowerCase()}-metrics`;
                const container = document.getElementById(containerId);

                if (container) {
                    container.innerHTML = `
                        <div class="mb-3">
                            <div class="metric-value model-color-${model.model_name.toLowerCase()}">
                                ${(model.accuracy * 100).toFixed(2)}%
                            </div>
                            <div class="metric-label">准确率 (Accuracy)</div>
                        </div>
                        <div class="row text-center">
                            <div class="col-6">
                                <small>精确率</small><br>
                                <strong>${(model.precision_score * 100).toFixed(2)}%</strong>
                            </div>
                            <div class="col-6">
                                <small>召回率</small><br>
                                <strong>${(model.recall_score * 100).toFixed(2)}%</strong>
                            </div>
                        </div>
                        <div class="text-center mt-2">
                            <small>F1-Score</small><br>
                            <strong>${(model.f1_score * 100).toFixed(2)}%</strong>
                        </div>
                        ${model.auc_score ? `
                            <div class="text-center mt-2">
                                <small>AUC</small><br>
                                <strong>${model.auc_score.toFixed(4)}</strong>
                            </div>
                        ` : ''}
                    `;
                }
            });
        }

        function displayMetricsChart(models) {
            const ctx = document.getElementById('metricsChart').getContext('2d');

            const labels = models.map(m => m.model_name);
            const accuracy = models.map(m => (m.accuracy * 100).toFixed(2));
            const precision = models.map(m => (m.precision_score * 100).toFixed(2));
            const recall = models.map(m => (m.recall_score * 100).toFixed(2));
            const f1 = models.map(m => (m.f1_score * 100).toFixed(2));

            if (metricsChart) {
                metricsChart.destroy();
            }

            metricsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '准确率',
                        data: accuracy,
                        backgroundColor: 'rgba(102, 126, 234, 0.8)',
                        borderColor: '#667eea',
                        borderWidth: 1
                    }, {
                        label: '精确率',
                        data: precision,
                        backgroundColor: 'rgba(118, 75, 162, 0.8)',
                        borderColor: '#764ba2',
                        borderWidth: 1
                    }, {
                        label: '召回率',
                        data: recall,
                        backgroundColor: 'rgba(240, 147, 251, 0.8)',
                        borderColor: '#f093fb',
                        borderWidth: 1
                    }, {
                        label: 'F1-Score',
                        data: f1,
                        backgroundColor: 'rgba(255, 107, 107, 0.8)',
                        borderColor: '#ff6b6b',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        }
                    }
                }
            });
        }

        function displayRocChart(models) {
            const ctx = document.getElementById('rocChart').getContext('2d');

            // 模拟ROC曲线数据
            const datasets = models.map(model => ({
                label: model.model_name + (model.auc_score ? ` (AUC=${model.auc_score.toFixed(3)})` : ''),
                data: generateROCData(model.auc_score || 0.85),
                borderColor: getColorForModel(model.model_name),
                backgroundColor: 'rgba(0, 0, 0, 0)',
                borderWidth: 2,
                tension: 0.4,
                pointRadius: 0
            }));

            // 添加随机分类线
            datasets.push({
                label: '随机分类 (AUC=0.5)',
                data: [{x: 0, y: 0}, {x: 1, y: 1}],
                borderColor: '#999',
                borderWidth: 2,
                borderDash: [5, 5],
                pointRadius: 0
            });

            if (rocChart) {
                rocChart.destroy();
            }

            rocChart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: {
                                display: true,
                                text: 'False Positive Rate'
                            },
                            min: 0,
                            max: 1
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'True Positive Rate'
                            },
                            min: 0,
                            max: 1
                        }
                    }
                }
            });
        }

        function generateROCData(auc) {
            const points = [];
            const steps = 100;
            for (let i = 0; i <= steps; i++) {
                const fpr = i / steps;
                // 使用指数函数模拟ROC曲线
                const tpr = Math.pow(fpr, (1 - auc) * 2);
                points.push({x: fpr, y: tpr});
            }
            return points;
        }

        function getColorForModel(modelName) {
            const colors = {
                'xgboost': '#667eea',
                'bilstm': '#764ba2',
                'transformer': '#f093fb',
                'ensemble': '#ff6b6b'
            };
            return colors[modelName.toLowerCase()] || '#999';
        }

        function displayConfusionChart() {
            const ctx = document.getElementById('confusionChart').getContext('2d');

            // 示例混淆矩阵数据
            const confusionMatrix = [
                [450, 50],   // 真阴性, 假阳性
                [30, 470]    // 假阴性, 真阳性
            ];

            if (confusionChart) {
                confusionChart.destroy();
            }

            confusionChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['正常', 'XSS攻击'],
                    datasets: [{
                        label: '预测为正常',
                        data: [confusionMatrix[0][0], confusionMatrix[1][0]],
                        backgroundColor: 'rgba(40, 167, 69, 0.7)',
                        borderColor: '#28a745',
                        borderWidth: 1
                    }, {
                        label: '预测为XSS',
                        data: [confusionMatrix[0][1], confusionMatrix[1][1]],
                        backgroundColor: 'rgba(220, 53, 69, 0.7)',
                        borderColor: '#dc3545',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        },
                        title: {
                            display: true,
                            text: '集成模型混淆矩阵'
                        }
                    },
                    scales: {
                        x: {
                            stacked: true
                        },
                        y: {
                            stacked: true,
                            title: {
                                display: true,
                                text: '样本数量'
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
