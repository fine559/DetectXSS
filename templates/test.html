<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; }
        .result { margin-top: 10px; padding: 10px; background: #f0f0f0; }
        pre { background: #fff; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>API测试页面</h1>
    
    <div class="test-section">
        <h2>1. 测试检测接口</h2>
        <input type="text" id="testText" placeholder="输入测试文本" value="hello" style="width: 300px; padding: 5px;">
        <button onclick="testDetect()">检测</button>
        <div class="result" id="detectResult"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 测试统计接口</h2>
        <button onclick="testStatistics()">获取统计</button>
        <div class="result" id="statsResult"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 测试历史接口</h2>
        <button onclick="testHistory()">获取历史</button>
        <div class="result" id="historyResult"></div>
    </div>
    
    <div class="test-section">
        <h2>4. 完整流程测试</h2>
        <button onclick="testFullFlow()">执行完整流程</button>
        <div class="result" id="fullFlowResult"></div>
    </div>

    <script>
        function testDetect() {
            const text = document.getElementById('testText').value;
            const resultDiv = document.getElementById('detectResult');
            
            resultDiv.innerHTML = '检测中...';
            
            fetch('/api/detect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                console.log('检测结果:', data);
            })
            .catch(error => {
                resultDiv.innerHTML = '错误: ' + error.message;
                console.error('检测错误:', error);
            });
        }
        
        function testStatistics() {
            const resultDiv = document.getElementById('statsResult');
            
            resultDiv.innerHTML = '加载中...';
            
            fetch('/api/statistics')
                .then(response => response.json())
                .then(data => {
                    resultDiv.innerHTML = '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                    console.log('统计结果:', data);
                })
                .catch(error => {
                    resultDiv.innerHTML = '错误: ' + error.message;
                    console.error('统计错误:', error);
                });
        }
        
        function testHistory() {
            const resultDiv = document.getElementById('historyResult');
            
            resultDiv.innerHTML = '加载中...';
            
            fetch('/api/history')
                .then(response => response.json())
                .then(data => {
                    resultDiv.innerHTML = '<pre>找到 ' + data.length + ' 条记录:\n' + JSON.stringify(data.slice(0, 3), null, 2) + '</pre>';
                    console.log('历史记录:', data);
                })
                .catch(error => {
                    resultDiv.innerHTML = '错误: ' + error.message;
                    console.error('历史错误:', error);
                });
        }
        
        function testFullFlow() {
            const resultDiv = document.getElementById('fullFlowResult');
            resultDiv.innerHTML = '开始测试...<br>';
            
            const text = 'test_' + Date.now();
            
            // 1. 检测
            resultDiv.innerHTML += '1. 检测: ' + text + '<br>';
            
            fetch('/api/detect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            })
            .then(response => response.json())
            .then(data => {
                resultDiv.innerHTML += '   检测完成<br>';
                console.log('检测结果:', data);
                
                // 2. 获取统计
                resultDiv.innerHTML += '2. 获取统计...<br>';
                return fetch('/api/statistics');
            })
            .then(response => response.json())
            .then(stats => {
                resultDiv.innerHTML += '   统计: ' + JSON.stringify(stats) + '<br>';
                console.log('统计:', stats);
                
                // 3. 获取历史
                resultDiv.innerHTML += '3. 获取历史...<br>';
                return fetch('/api/history');
            })
            .then(response => response.json())
            .then(history => {
                resultDiv.innerHTML += '   历史记录数: ' + history.length + '<br>';
                console.log('历史:', history);
                resultDiv.innerHTML += '<br>测试完成!';
            })
            .catch(error => {
                resultDiv.innerHTML += '<br>错误: ' + error.message;
                console.error('流程错误:', error);
            });
        }
        
        // 页面加载时自动测试
        window.onload = function() {
            console.log('页面已加载');
            testStatistics();
            testHistory();
        };
    </script>
</body>
</html>
