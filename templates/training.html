<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型训练与评估 - XSS检测系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .metrics-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .back-link {
            color: white;
            text-decoration: none;
            margin-bottom: 20px;
            display: inline-block;
        }
        .back-link:hover {
            color: #f0f0f0;
        }
        .model-select {
            margin-bottom: 20px;
        }
        .training-progress {
            margin-top: 20px;
        }
        .log-container {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }
        .log-entry {
            margin-bottom: 5px;
        }
        .log-info { color: #00ff00; }
        .log-warning { color: #ffff00; }
        .log-error { color: #ff0000; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>

        <div class="card mt-3">
            <div class="card-header">
                <h3><i class="fas fa-graduation-cap"></i> 模型训练与评估</h3>
                <p class="mb-0">查看和管理模型训练过程</p>
            </div>
            <div class="card-body p-4">
                <!-- 模型选择 -->
                <div class="row">
                    <div class="col-md-12">
                        <div class="metrics-card">
                            <h5>选择模型</h5>
                            <div class="model-select">
                                <select class="form-select" id="modelSelect" onchange="loadTrainingHistory()">
                                    <option value="xgboost">XGBoost</option>
                                    <option value="bilstm">BiLSTM</option>
                                    <option value="transformer">Transformer</option>
                                    <option value="ensemble" selected>Ensemble</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 训练曲线 -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="metrics-card">
                            <h5>训练 Loss 曲线</h5>
                            <div style="position: relative; height: 300px;">
                                <canvas id="lossChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="metrics-card">
                            <h5>训练 Accuracy 曲线</h5>
                            <div style="position: relative; height: 300px;">
                                <canvas id="accuracyChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 训练指标统计 -->
                <div class="row mt-4">
                    <div class="col-md-12">
                        <div class="metrics-card">
                            <h5>训练统计</h5>
                            <div class="row text-center">
                                <div class="col-md-3">
                                    <div class="h3" id="totalEpochs">0</div>
                                    <small>总轮次</small>
                                </div>
                                <div class="col-md-3">
                                    <div class="h3" id="finalLoss">-</div>
                                    <small>最终 Loss</small>
                                </div>
                                <div class="col-md-3">
                                    <div class="h3" id="finalAccuracy">-</div>
                                    <small>最终 Accuracy</small>
                                </div>
                                <div class="col-md-3">
                                    <div class="h3" id="bestAccuracy">-</div>
                                    <small>最佳 Accuracy</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 训练日志 -->
                <div class="row mt-4">
                    <div class="col-md-12">
                        <div class="metrics-card">
                            <h5><i class="fas fa-terminal"></i> 训练日志</h5>
                            <div class="log-container" id="logContainer">
                                <div class="log-entry log-info">[系统] 准备加载训练历史数据...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let lossChart = null;
        let accuracyChart = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadTrainingHistory();
        });

        function loadTrainingHistory() {
            const modelName = document.getElementById('modelSelect').value;
            addLog(`[系统] 正在加载 ${modelName} 模型的训练历史...`, 'info');

            fetch(`/api/training-history?model=${modelName}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        displayCharts(data.data);
                        displayStats(data.data);
                        addLog(`[成功] ${modelName} 模型训练历史加载完成，共 ${data.data.length} 个 epoch`, 'info');
                    } else {
                        addLog(`[错误] 加载失败: ${data.error}`, 'error');
                    }
                })
                .catch(error => {
                    addLog(`[错误] 请求失败: ${error.message}`, 'error');
                });
        }

        function displayCharts(history) {
            const epochs = history.map(h => h.epoch);
            const trainLoss = history.map(h => h.loss);
            const valLoss = history.map(h => h.val_loss);
            const trainAcc = history.map(h => h.accuracy);
            const valAcc = history.map(h => h.val_accuracy);

            // Loss Chart
            const lossCtx = document.getElementById('lossChart').getContext('2d');
            if (lossChart) {
                lossChart.destroy();
            }
            lossChart = new Chart(lossCtx, {
                type: 'line',
                data: {
                    labels: epochs,
                    datasets: [{
                        label: '训练 Loss',
                        data: trainLoss,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }, {
                        label: '验证 Loss',
                        data: valLoss,
                        borderColor: '#764ba2',
                        backgroundColor: 'rgba(118, 75, 162, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Loss'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Epoch'
                            }
                        }
                    }
                }
            });

            // Accuracy Chart
            const accCtx = document.getElementById('accuracyChart').getContext('2d');
            if (accuracyChart) {
                accuracyChart.destroy();
            }
            accuracyChart = new Chart(accCtx, {
                type: 'line',
                data: {
                    labels: epochs,
                    datasets: [{
                        label: '训练 Accuracy',
                        data: trainAcc,
                        borderColor: '#f093fb',
                        backgroundColor: 'rgba(240, 147, 251, 0.1)',
                        tension: 0.4,
                        fill: true
                    }, {
                        label: '验证 Accuracy',
                        data: valAcc,
                        borderColor: '#ff6b6b',
                        backgroundColor: 'rgba(255, 107, 107, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 0.5,
                            max: 1,
                            ticks: {
                                callback: function(value) {
                                    return (value * 100).toFixed(0) + '%';
                                }
                            },
                            title: {
                                display: true,
                                text: 'Accuracy'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: 'Epoch'
                            }
                        }
                    }
                }
            });
        }

        function displayStats(history) {
            if (history.length === 0) {
                return;
            }

            const totalEpochs = history.length;
            const finalLoss = history[history.length - 1].loss;
            const finalAccuracy = history[history.length - 1].accuracy;
            const bestAccuracy = Math.max(...history.map(h => h.accuracy));

            document.getElementById('totalEpochs').textContent = totalEpochs;
            document.getElementById('finalLoss').textContent = finalLoss ? finalLoss.toFixed(4) : '-';
            document.getElementById('finalAccuracy').textContent = finalAccuracy ? (finalAccuracy * 100).toFixed(2) + '%' : '-';
            document.getElementById('bestAccuracy').textContent = (bestAccuracy * 100).toFixed(2) + '%';
        }

        function addLog(message, type = 'info') {
            const container = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logClass = type === 'error' ? 'log-error' : (type === 'warning' ? 'log-warning' : 'log-info');
            container.innerHTML += `<div class="log-entry ${logClass}">[${timestamp}] ${message}</div>`;
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
